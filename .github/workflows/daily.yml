name: Daily capture

on:
  schedule:
    - cron: '17 8 * * *'   # 08:17 UTC every day
  workflow_dispatch: {}      # lets you run it on demand from the Actions tab

permissions:
  contents: write            # commit the daily snapshot back to the repo
  pages: write               # deploy the site
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - name: Capture today's snapshot
        run: npm run scrape

      - name: Regenerate CSV exports
        run: npm run export

      - name: Commit snapshot + exports (permanent log)
        run: |
          git config user.name "demand-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "snapshot $(date -u +%F)" || echo "no changes to commit"
          git push

      - name: Build site payload
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
