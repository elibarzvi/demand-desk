name: Daily capture

on:
  schedule:
    # GitHub cron is best-effort (often delayed hours, sometimes skipped), so run a
    # few times a day for redundancy. The job is idempotent — one snapshot per day,
    # overwritten — so extra runs just make sure the day gets captured.
    - cron: '17 8 * * *'    # 08:17 UTC
    - cron: '17 14 * * *'   # 14:17 UTC (backup)
    - cron: '17 21 * * *'   # 21:17 UTC (backup)
  workflow_dispatch:         # lets you run it on demand from the Actions tab
    inputs:
      notify_test:
        description: 'Send a Slack delivery test instead of only real alerts'
        type: boolean
        default: false
  # A push that changes the site, scripts or libraries redeploys immediately.
  # Without this, a UI fix sat invisible until the next scheduled capture, up to
  # eight hours later, because only the cron rebuilt Pages. Push runs skip the
  # scrape and the commit: they rebuild the site from data already in the repo,
  # so pushing code never mutates the daily log or spends an API call.
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'src/**'
      - '.github/workflows/daily.yml'

permissions:
  contents: write            # commit the daily snapshot back to the repo
  pages: write               # deploy the site
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        if: github.event_name != 'push'

      - name: Capture today's snapshot
        if: github.event_name != 'push'
        run: npm run scrape
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}

      - name: Regenerate CSV exports
        run: npm run export

      - name: Derive metrics, signals and alerts
        run: npm run derive

      # Runs before the commit so it can diff today's alerts against the version
      # still at HEAD, which is how it tells a new condition from an ongoing one.
      # Skipped on push runs: those rebuild the site from existing data, so there
      # is nothing new to announce.
      - name: Notify Slack of anything notable
        if: github.event_name != 'push'
        run: npm run notify ${{ inputs.notify_test && '-- --test' || '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Commit snapshot + exports (permanent log)
        if: github.event_name != 'push'
        run: |
          git config user.name "demand-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "snapshot $(date -u +%F)" || echo "no changes to commit"
          git push

      - name: Build site payload
        run: npm run build

      - name: Bundle full dataset (ZIP)
        run: npm run bundle

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
